name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"
      - name: Run test suite
        run: pytest
      - name: Smoke-test preview generation
        run: python scripts/generate_previews.py --output-dir /tmp/preview-smoke
      - name: Smoke-test docs site build (runs every example snippet)
        run: python scripts/build_docs.py --output-dir /tmp/docs-smoke
